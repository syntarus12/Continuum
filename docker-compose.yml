name: continuum-community

# Safe by default: only the API and local console are published to loopback.
# Databases stay on the private Compose network unless the debug override is
# explicitly selected. The backend image is published for releases and keeps
# a remote source build as a development fallback.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: continuum_ce_qdrant
    restart: unless-stopped
    volumes:
      - continuum_ce_qdrant:/qdrant/storage
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  neo4j:
    image: neo4j:5.26.0-community
    container_name: continuum_ce_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-community-change-me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 512m
    volumes:
      - continuum_ce_neo4j:/data
      - continuum_ce_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-community-change-me}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: continuum_ce_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - continuum_ce_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: continuum_ce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community-postgres}
      POSTGRES_DB: memoryos_analytics
    volumes:
      - continuum_ce_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryos -d memoryos_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${SYNTARUS_BACKEND_IMAGE:-ghcr.io/syntarus12/continuum-backend:latest}
    # The public checkout runs the published image. Contributors working from
    # the MemoryOS monorepo can add docker-compose.source.yml to build locally.
    pull_policy: missing
    container_name: continuum_ce_backend
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-community-change-me}
      REDIS_URL: redis://redis:6379/0
      ANALYTICS_DB_URL: postgresql://memoryos:${POSTGRES_PASSWORD:-community-postgres}@postgres:5432/memoryos_analytics
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:5173}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      MEMORYOS_ALLOW_OPEN: ${MEMORYOS_ALLOW_OPEN:-true}
      MEMORYOS_API_KEYS: ${MEMORYOS_API_KEYS:-sk_mem_community:user_demo}
      MEMORYOS_SSE_SECRET: ${MEMORYOS_SSE_SECRET:-community-only-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-community-session-secret-change-me}
      COMMUNITY_MODE: ${COMMUNITY_MODE:-true}
      COMMUNITY_API_KEY: ${COMMUNITY_API_KEY:-sk_mem_community}
      COMMUNITY_ACCOUNT_ID: ${COMMUNITY_ACCOUNT_ID:-community_local}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - continuum_ce_fastembed_cache:/tmp/fastembed_cache
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  console:
    profiles: ["ui"]
    image: ${SYNTARUS_CONSOLE_IMAGE:-ghcr.io/syntarus12/continuum-console:latest}
    build:
      context: ./console
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: continuum_ce_console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  continuum_ce_qdrant:
  continuum_ce_neo4j:
  continuum_ce_neo4j_logs:
  continuum_ce_redis:
  continuum_ce_postgres:
  continuum_ce_fastembed_cache:
