services:
  backend:
    environment:
      MEMORYOS_ALLOW_OPEN: "false"
      MEMORYOS_API_KEYS: ${MEMORYOS_API_KEYS:?Set a strong MEMORYOS_API_KEYS value in .env}
      MEMORYOS_SSE_SECRET: ${MEMORYOS_SSE_SECRET:?Set a strong MEMORYOS_SSE_SECRET value in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a strong NEO4J_PASSWORD value in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD value in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your public console origin}
    ports: []

  caddy:
    image: caddy:2.8-alpine
    container_name: continuum_ce_caddy
    restart: unless-stopped
    profiles: ["public"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to a DNS name pointing at this host}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - continuum_ce_caddy_data:/data
      - continuum_ce_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  continuum_ce_caddy_data:
  continuum_ce_caddy_config:
