[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "syntarus-mcp"
version = "0.1.0"
description = "MCP server for Syntarus memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Until the public PyPI release, install the matching SDK directly from the
# repository.  This makes `uvx --from git+…#subdirectory=sdk/mcp` usable today
# instead of resolving a package name that has not been published yet.
dependencies = [
  "syntarus @ git+https://github.com/sujalkherawat25-stack/memoryos.git#subdirectory=sdk",
  "mcp>=1.6,<2",
]

[project.scripts]
syntarus-mcp = "syntarus_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syntarus_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
